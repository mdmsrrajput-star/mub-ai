name: Cloudflare migration checks
on:
  push:
    branches:
      - migration/cloudflare-workers
  pull_request:
    branches:
      - main
jobs:
  syntax-and-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Worker and API syntax
        run: |
          node --check src/worker.js
          node --check api/_lib/vercel-adapter.js
          node --check api/paper-trades.js
          node --check api/paper-predictions.js
          node --check api/crypto-signal.js
          node --check api/forex-signal.js
          node --check api/forex-market.js
          node --check api/auto-scan.js
      - name: Test Worker adapter
        run: node --test tests/worker-adapter.test.js
      - name: Install Wrangler and validate deployment bundle
        run: |
          npm install
          npx wrangler deploy --dry-run
