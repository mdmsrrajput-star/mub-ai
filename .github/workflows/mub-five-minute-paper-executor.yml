name: MuB five-minute paper executor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mub-paper-executor
  cancel-in-progress: false

jobs:
  paper-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Scan signals and manage paper positions
        env:
          MUB_BASE_URL: ${{ secrets.MUB_BASE_URL }}
          PAPER_WRITE_KEY: ${{ secrets.PAPER_WRITE_KEY }}
          MUB_SCHEDULED_ENTRIES_ENABLED: ${{ secrets.MUB_SCHEDULED_ENTRIES_ENABLED }}
        run: |
          node <<'NODE'
          const base = (process.env.MUB_BASE_URL || "").replace(/\/$/, "");
          const key = process.env.PAPER_WRITE_KEY;
          if (!base || !key) {
            console.error("Configure repository Actions secrets MUB_BASE_URL and PAPER_WRITE_KEY.");
            process.exit(1);
          }

          async function request(path, options = {}) {
            const response = await fetch(base + path, {
              ...options,
              headers: {
                "Content-Type": "application/json",
                ...(options.headers || {})
              },
              signal: AbortSignal.timeout(15000)
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok) {
              throw new Error(path + " returned HTTP " + response.status + ": " + (data.error || "request failed"));
            }
            return data;
          }

          async function write(body) {
            return request("/api/paper-trades", {
              method: "POST",
              headers: { "x-paper-key": key },
              body: JSON.stringify(body)
            });
          }

          async function main() {
            // Always manage existing positions first. A failed manage call aborts this cycle.
            const managed = await write({ action: "manage" });
            console.log("Position management completed:", JSON.stringify((managed.checked || []).map(x => ({
              symbol: x.symbol, closed: x.closed, reason: x.reason || null
            }))));

            // The dashboard Auto button controls its own multi-asset prediction loop.
            // Do not let this separate cron silently open positions unless explicitly enabled.
            if (process.env.MUB_SCHEDULED_ENTRIES_ENABLED !== "true") {
              console.log("Scheduled spot entries disabled; existing positions were managed. Use the dashboard Auto control for paper predictions.");
              return;
            }

            for (const symbol of ["BTCUSDT", "ETHUSDT"]) {
              const signal = await request("/api/crypto-signal?symbol=" + symbol);
              if (signal.mode !== "PAPER_ONLY" || signal.liveTradingEnabled !== false) {
                throw new Error("Signal endpoint safety mode check failed for " + symbol);
              }
              if (!["BUY", "SELL"].includes(signal.signal)) {
                console.log(symbol + ": WAIT; no paper order.");
                continue;
              }

              const accountResult = await write({ action: "status" });
              const account = accountResult.account || {};
              if (account.positions && account.positions[symbol]) {
                console.log(symbol + ": position already open; no duplicate entry.");
                continue;
              }

              const entry = Number(signal.candle && signal.candle.close);
              const atr = Number(signal.indicators && signal.indicators.atr14);
              if (!Number.isFinite(entry) || entry <= 0 || !Number.isFinite(atr) || atr <= 0) {
                console.log(symbol + ": invalid candle/ATR; fail closed.");
                continue;
              }

              // Conservative, fixed paper-only sizing; no leverage or live exchange orders.
              const side = signal.signal === "BUY" ? "LONG" : "SHORT";
              const stopDistance = 1.5 * atr;
              const targetDistance = 2 * atr;
              const stopLoss = side === "LONG" ? entry - stopDistance : entry + stopDistance;
              const takeProfit = side === "LONG" ? entry + targetDistance : entry - targetDistance;

              const opened = await write({
                action: "open",
                symbol,
                side,
                price: entry,
                notional: 1000,
                stopLoss,
                takeProfit
              });
              console.log(symbol + ": PAPER position opened, side=" + side +
                ", entry=" + entry + ", stop=" + stopLoss + ", target=" + takeProfit +
                ", mode=" + opened.mode);
            }
          }

          main().catch(error => {
            console.error("MuB paper cycle failed:", error.message);
            process.exit(1);
          });
          NODE
